// A virtualised network: a layer 2 broadcast domain.
message Network {
  option (kubenfv.kubevim.options.v1.ifa_message) = {ref: "IFA006 8.4.5.2 VirtualNetwork, 8.4.4.2 VirtualNetworkData"};

  // Identifier of the network: a UUID, the Kubernetes UID of the object behind it.
  string network_resource_id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.5.2 VirtualNetwork.networkResourceId"}
  ];
  // Name of the network, given by the consumer.
  string network_resource_name = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.5.2 VirtualNetwork.networkResourceName"}
  ];
  // Subnets of the network.
  repeated string subnet_id = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.5.2 VirtualNetwork.subnetId"}
  ];
  // Ports of the network.
  repeated string network_port_id = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 8.4.5.2 VirtualNetwork.networkPort"
      departure: {
        kind: KIND_DEVIATION
        translates: true
        rationale: "Port identifiers instead of embedded ports; ports are their own resource (ListPorts filtered by networkId)."
      }
    }
  ];
  // Minimum bandwidth in Mbps; 0 means no guarantee.
  uint32 bandwidth = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 8.4.4.2 VirtualNetworkData.bandwidth"
      departure: {
        kind: KIND_RESTRICTION
        translates: false
        rationale: "Kube-OVN has no per-network bandwidth guarantee; a non-zero value is rejected."
      }
    }
  ];
  // How traffic of the network is separated.
  NetworkType network_type = 6 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    },
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 8.4.4.2 VirtualNetworkData.networkType"
      departure: {
        kind: KIND_DEVIATION
        translates: true
        rationale: "A closed enumeration instead of an extensible string."
      }
    }
  ];
  // Provider network configured in the VIM (a Kube-OVN provider network or an
  // SR-IOV device pool); required for VLAN and FLAT networks.
  string provider_network = 7 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.4.2 VirtualNetworkData.providerNetwork"}
  ];
  // VLAN ID for VLAN networks; assigned by the VIM for GENEVE networks.
  uint32 segmentation_id = 8 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.4.2 VirtualNetworkData.segmentationId"}
  ];
  // Quality of service the network supports.
  repeated NetworkQoS network_qos = 9 [
    json_name = "networkQoS",
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 8.4.4.2 VirtualNetworkData.networkQoS"
      departure: {
        kind: KIND_RESTRICTION
        translates: false
        rationale: "No network-level QoS in Kube-OVN; a value is rejected."
      }
    }
  ];
  // The network is shared among consumers; unset means true.
  optional bool is_shared = 10 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 8.4.4.2 VirtualNetworkData.isShared"
      departure: {
        kind: KIND_RESTRICTION
        translates: false
        rationale: "Every network is shared until Kube-VIM has tenancy; false is rejected."
      }
    }
  ];
  // Criteria for sharing the network, e.g. authorised consumers.
  string sharing_criteria = 11 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 8.4.4.2 VirtualNetworkData.sharingCriteria"
      departure: {
        kind: KIND_RESTRICTION
        translates: false
        rationale: "No tenancy; a value is rejected."
      }
    }
  ];
  // Subnets created with the network.
  repeated SubnetData layer3_attributes = 12 [
    (google.api.field_behavior) = INPUT_ONLY,
