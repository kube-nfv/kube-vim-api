syntax = "proto3";

package kubenfv.kubevim.compute.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "kubenfv/kubevim/common/v1/affinity.proto";
import "kubenfv/kubevim/common/v1/common.proto";
import "kubenfv/kubevim/common/v1/volume.proto";
import "kubenfv/kubevim/flavour/v1/flavour.proto";
import "kubenfv/kubevim/options/v1/options.proto";
import "protoc-gen-openapiv3/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_document) = {
  info: {
    title: "Kube-VIM virtualised compute API"
    version: "1.0.0"
  }
  components: {
    security_schemes: {
      key: "oauth2"
      value: {
        type: TYPE_OAUTH2
        description: "OAuth 2.0 client credentials (SOL 013 8.3). The token URL is deployment specific."
        flows: {
          client_credentials: {
            token_url: "https://idp.example.com/oauth2/token"
            scopes: {
              key: "compute:v1:allocate"
              value: "Allocate compute resources"
            }
            scopes: {
              key: "compute:v1:query"
              value: "Query compute resources"
            }
            scopes: {
              key: "compute:v1:update"
              value: "Update compute resources and attach or detach volumes"
            }
            scopes: {
              key: "compute:v1:terminate"
              value: "Terminate compute resources"
            }
            scopes: {
              key: "compute:v1:operate"
              value: "Operate compute resources"
            }
            scopes: {
              key: "compute:v1:scale"
              value: "Scale compute resources"
            }
            scopes: {
              key: "compute:v1:migrate"
              value: "Migrate compute resources"
            }
          }
        }
      }
    }
  }
};
option (kubenfv.kubevim.options.v1.api) = {
  name: "compute"
  version: "1.0.0"
};

// Virtualised compute resources management.
service ComputeService {
  option (kubenfv.kubevim.options.v1.ifa_service) = {ref: "IFA006 7.3.1 Virtualised Compute Resources Management Interface"};

  // Creates a compute resource.
  rpc CreateCompute(CreateComputeRequest) returns (Compute) {
    option (google.api.http) = {
      post: "/compute/v1/computes"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      security: {
        schemes: {
          key: "oauth2"
          value: {scopes: "compute:v1:allocate"}
        }
      }
    };
    option (kubenfv.kubevim.options.v1.ifa_method) = {ref: "IFA006 7.3.1.2 Allocate Virtualised Compute Resource"};
  }

  // Returns one compute resource.
  rpc GetCompute(GetComputeRequest) returns (Compute) {
    option (google.api.http) = {get: "/compute/v1/computes/{compute_id}"};
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      security: {
        schemes: {
          key: "oauth2"
          value: {scopes: "compute:v1:query"}
        }
      }
    };
    option (kubenfv.kubevim.options.v1.ifa_method) = {
      ref: "IFA006 7.3.1.3 Query Virtualised Compute Resource"
      departure: {
        kind: KIND_DEVIATION
        translates: true
        rationale: "Query filtered by computeId, as a read by identifier."
      }
    };
  }

  // Returns the compute resources matching a filter.
  rpc ListComputes(ListComputesRequest) returns (ListComputesResponse) {
    option (google.api.http) = {get: "/compute/v1/computes"};
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      security: {
        schemes: {
          key: "oauth2"
          value: {scopes: "compute:v1:query"}
        }
      }
    };
    option (kubenfv.kubevim.options.v1.ifa_method) = {ref: "IFA006 7.3.1.3 Query Virtualised Compute Resource"};
  }

  // Updates a compute resource: adds or removes network interfaces and changes metadata.
  rpc UpdateCompute(UpdateComputeRequest) returns (Compute) {
    option (google.api.http) = {
      patch: "/compute/v1/computes/{compute_id}"
      body: "update"
    };
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      security: {
        schemes: {
          key: "oauth2"
          value: {scopes: "compute:v1:update"}
        }
      }
    };
    option (kubenfv.kubevim.options.v1.ifa_method) = {
      ref: "IFA006 7.3.1.4 Update Virtualised Compute Resource"
      departure: {
        kind: KIND_DEVIATION
        translates: true
        rationale: "Only the changes set in ComputeUpdate apply."
      }
    };
  }

  // Deletes a compute resource.
  rpc DeleteCompute(DeleteComputeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/compute/v1/computes/{compute_id}"};
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      security: {
        schemes: {
          key: "oauth2"
          value: {scopes: "compute:v1:terminate"}
        }
      }
    };
    option (kubenfv.kubevim.options.v1.ifa_method) = {
      ref: "IFA006 7.3.1.5 Terminate Virtualised Compute Resource"
      departure: {
        kind: KIND_DEVIATION
        translates: true
        rationale: "One resource per request (the path identifies it) instead of a list of identifiers."
      }
    };
  }

  // Runs an operation on a compute resource, e.g. start, stop or reboot.
  rpc OperateCompute(OperateComputeRequest) returns (OperateComputeResponse) {
    option (google.api.http) = {
      post: "/compute/v1/computes/{compute_id}/operate"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      security: {
        schemes: {
          key: "oauth2"
          value: {scopes: "compute:v1:operate"}
        }
      }
    };
    option (kubenfv.kubevim.options.v1.ifa_method) = {ref: "IFA006 7.3.1.6 Operate Virtualised Compute Resource"};
  }

  // Changes the flavour of a compute resource.
  rpc ScaleCompute(ScaleComputeRequest) returns (Compute) {
    option (google.api.http) = {
      post: "/compute/v1/computes/{compute_id}/scale"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      security: {
        schemes: {
          key: "oauth2"
          value: {scopes: "compute:v1:scale"}
        }
      }
    };
    option (kubenfv.kubevim.options.v1.ifa_method) = {ref: "IFA006 7.3.1.7 Scale Virtualised Compute Resource"};
  }

  // Moves a compute resource to another host.
  rpc MigrateCompute(MigrateComputeRequest) returns (Compute) {
    option (google.api.http) = {
      post: "/compute/v1/computes/{compute_id}/migrate"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      security: {
        schemes: {
          key: "oauth2"
          value: {scopes: "compute:v1:migrate"}
        }
      }
    };
    option (kubenfv.kubevim.options.v1.ifa_method) = {ref: "IFA006 7.3.1.8 Migrate Virtualised Compute Resource"};
  }

  // Attaches a volume to a compute resource.
  rpc AttachVolume(AttachVolumeRequest) returns (Compute) {
    option (google.api.http) = {
      post: "/compute/v1/computes/{compute_id}/attachVolume"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      security: {
        schemes: {
          key: "oauth2"
          value: {scopes: "compute:v1:update"}
        }
      }
    };
    option (kubenfv.kubevim.options.v1.ifa_method) = {ref: "IFA006 7.3.1.10 Attach Virtualised Storage Resource"};
  }

  // Detaches a volume from a compute resource.
  rpc DetachVolume(DetachVolumeRequest) returns (Compute) {
    option (google.api.http) = {
      post: "/compute/v1/computes/{compute_id}/detachVolume"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      security: {
        schemes: {
          key: "oauth2"
          value: {scopes: "compute:v1:update"}
        }
      }
    };
    option (kubenfv.kubevim.options.v1.ifa_method) = {
      ref: "IFA006 7.3.1.11 Detach Virtualised Storage Resource"
      departure: {
        kind: KIND_DEVIATION
        translates: true
        rationale: "Returns the updated compute resource; IFA returns nothing."
      }
    };
  }

  // Creates a compute affinity or anti-affinity group.
  rpc CreateAffinityGroup(kubenfv.kubevim.common.v1.CreateAffinityGroupRequest) returns (kubenfv.kubevim.common.v1.AffinityGroup) {
    option (google.api.http) = {
      post: "/compute/v1/affinityGroups"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      security: {
        schemes: {
          key: "oauth2"
          value: {scopes: "compute:v1:allocate"}
        }
      }
    };
    option (kubenfv.kubevim.options.v1.ifa_method) = {ref: "IFA006 7.3.1.9 Create Virtualised Compute Resource Affinity Or AntiAffinity Constraints Group"};
  }

  // Returns one compute affinity group.
  rpc GetAffinityGroup(kubenfv.kubevim.common.v1.GetAffinityGroupRequest) returns (kubenfv.kubevim.common.v1.AffinityGroup) {
    option (google.api.http) = {get: "/compute/v1/affinityGroups/{group_id}"};
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      security: {
        schemes: {
          key: "oauth2"
          value: {scopes: "compute:v1:query"}
        }
      }
    };
    option (kubenfv.kubevim.options.v1.ifa_method) = {
      departure: {
        kind: KIND_EXTENSION
        translates: true
        rationale: "IFA can create groups but not read them back."
      }
    };
  }

  // Returns the compute affinity groups.
  rpc ListAffinityGroups(kubenfv.kubevim.common.v1.ListAffinityGroupsRequest) returns (kubenfv.kubevim.common.v1.ListAffinityGroupsResponse) {
    option (google.api.http) = {get: "/compute/v1/affinityGroups"};
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      security: {
        schemes: {
          key: "oauth2"
          value: {scopes: "compute:v1:query"}
        }
      }
    };
    option (kubenfv.kubevim.options.v1.ifa_method) = {
      departure: {
        kind: KIND_EXTENSION
        translates: true
        rationale: "IFA can create groups but not list them."
      }
    };
  }

  // Deletes a compute affinity group.
  rpc DeleteAffinityGroup(kubenfv.kubevim.common.v1.DeleteAffinityGroupRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/compute/v1/affinityGroups/{group_id}"};
    option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_operation) = {
      security: {
        schemes: {
          key: "oauth2"
          value: {scopes: "compute:v1:terminate"}
        }
      }
    };
    option (kubenfv.kubevim.options.v1.ifa_method) = {
      departure: {
        kind: KIND_EXTENSION
        translates: true
        rationale: "IFA can create groups but not delete them."
      }
    };
  }
}

// A virtualised compute resource: a virtual machine.
message Compute {
  option (kubenfv.kubevim.options.v1.ifa_message) = {ref: "IFA006 8.4.3.2 VirtualCompute"};

  // Identifier of the compute resource: a UUID, the Kubernetes UID of the object behind it.
  string compute_id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.2 VirtualCompute.computeId"}
  ];
  // Name of the compute resource, given by the consumer. The VIM normalises it to a DNS label
  // and defaults it to the image name followed by "-vm".
  string compute_name = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.2 VirtualCompute.computeName"}
  ];
  // Flavour the compute resource is sized by.
  string flavour_id = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.uuid = true,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.2 VirtualCompute.flavourId"}
  ];
  // Acceleration capabilities in use, as Kubernetes device resource names.
  repeated string acceleration_capability = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 8.4.3.2 VirtualCompute.accelerationCapability"
      departure: {
        kind: KIND_DEVIATION
        translates: true
        rationale: "IFA leaves the content unspecified; each entry names a device exposed by a Kubernetes device plugin."
      }
    }
  ];
  // Virtual CPUs of the compute resource.
  VirtualCpu virtual_cpu = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.2 VirtualCompute.virtualCpu"}
  ];
  // Virtual memory of the compute resource.
  VirtualMemory virtual_memory = 6 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.2 VirtualCompute.virtualMemory"}
  ];
  // Network interfaces of the compute resource.
  repeated VirtualNetworkInterface virtual_network_interface = 7 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.2 VirtualCompute.virtualNetworkInterface"}
  ];
  // Volumes attached to the compute resource, including its boot disk.
  repeated kubenfv.kubevim.common.v1.Volume virtual_disks = 8 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.2 VirtualCompute.virtualDisks"}
  ];
  // Software image the compute resource boots from; empty for an empty container.
  string vc_image_id = 9 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.2 VirtualCompute.vcImageId"}
  ];
  // Resource zone of the compute resource.
  string zone_id = 10 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.2 VirtualCompute.zoneId"}
  ];
  // Host the compute resource runs on (the Kubernetes node).
  string host_id = 11 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.2 VirtualCompute.hostId"}
  ];
  // Administrative state of the compute resource.
  kubenfv.kubevim.common.v1.OperationalState operational_state = 12 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.2 VirtualCompute.operationalState"}
  ];
  // Running state of the compute resource.
  ComputeRunningState running_state = 13 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 8.4.3.2 VirtualCompute.runningState"
      departure: {
        kind: KIND_DEVIATION
        translates: true
        rationale: "Adds transitional and failure states; each maps to the nearest IFA state."
      }
    }
  ];
  // Metadata owned by the consumer and never interpreted by the VIM.
  map<string, string> metadata = 14 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 8.4.3.2 VirtualCompute.metadata"
      departure: {
        kind: KIND_DEVIATION
        translates: true
        rationale: "String values only, where IFA KeyValuePair allows any JSON value."
      }
    }
  ];
  // Human-readable reason when the running state is FAILED.
  string status_detail = 15 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      departure: {
        kind: KIND_EXTENSION
        translates: true
        rationale: "Reports why a compute resource failed; replaces the v0 failure-reason metadata key."
      }
    }
  ];
  // Auxiliary information from the VIM, e.g. KubeVirt status; keys are listed in the metadata key registry.
  map<string, string> vim_metadata = 16 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      departure: {
        kind: KIND_EXTENSION
        translates: true
        rationale: "VIM-side diagnostics kept apart from the consumer-owned metadata."
      }
    }
  ];
}

// Running state of a compute resource.
// Values may be added as KubeVirt support grows; clients should accept unknown values.
enum ComputeRunningState {
  // The VIM cannot determine the state.
  COMPUTE_RUNNING_STATE_UNSPECIFIED = 0;
  // Requested to start, not running yet. IFA: STOPPED.
  COMPUTE_RUNNING_STATE_STARTING = 1;
  // Running. IFA: STARTED.
  COMPUTE_RUNNING_STATE_STARTED = 2;
  // Requested to stop, still running. IFA: STARTED.
  COMPUTE_RUNNING_STATE_STOPPING = 3;
  // Stopped. IFA: STOPPED.
  COMPUTE_RUNNING_STATE_STOPPED = 4;
  // Paused, memory kept. IFA: PAUSED.
  COMPUTE_RUNNING_STATE_PAUSED = 5;
  // Suspended, memory saved to disk. IFA: SUSPENDED.
  COMPUTE_RUNNING_STATE_SUSPENDED = 6;
  // Rebooting. IFA: REBOOTING.
  COMPUTE_RUNNING_STATE_REBOOTING = 7;
  // Moving to another host while running. IFA: STARTED.
  COMPUTE_RUNNING_STATE_MIGRATING = 8;
  // Failed to start or crashed; see status_detail. IFA: STOPPED.
  COMPUTE_RUNNING_STATE_FAILED = 9;
  // Being deleted. IFA: STOPPED.
  COMPUTE_RUNNING_STATE_TERMINATING = 10;
}

// Virtual CPUs of a compute resource.
message VirtualCpu {
  option (kubenfv.kubevim.options.v1.ifa_message) = {ref: "IFA006 8.4.3.3 VirtualCpu"};

  string cpu_architecture = 1 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.3 VirtualCpu.cpuArchitecture"}];
  uint32 num_virtual_cpu = 2 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.3 VirtualCpu.numVirtualCpu"}];
  // Minimum CPU clock rate in MHz; 0 when not guaranteed.
  uint32 cpu_clock = 3 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.3 VirtualCpu.cpuClock"}];
  string virtual_cpu_oversubscription_policy = 4 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.3 VirtualCpu.virtualCpuOversubscriptionPolicy"}];
  VirtualCpuPinning virtual_cpu_pinning = 5 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.3 VirtualCpu.virtualCpuPinning"}];
  string power_state = 6 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.3 VirtualCpu.powerState"}];
}

// CPU pinning of a compute resource.
message VirtualCpuPinning {
  option (kubenfv.kubevim.options.v1.ifa_message) = {ref: "IFA006 8.4.3.4 VirtualCpuPinning"};

  kubenfv.kubevim.flavour.v1.VirtualCpuPinningPolicy cpu_pinning_policy = 1 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.4 VirtualCpuPinning.cpuPinningPolicy"}];
  repeated string cpu_pinning_rules = 2 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.4 VirtualCpuPinning.cpuPinningRules"}];
  // Physical CPU each virtual CPU is pinned to.
  map<uint32, uint32> cpu_map = 3 [(kubenfv.kubevim.options.v1.ifa_field) = {
    ref: "IFA006 8.4.3.4 VirtualCpuPinning.cpuMap"
    departure: {
      kind: KIND_DEVIATION
      translates: true
      rationale: "IFA leaves the content unspecified; a map from virtual to physical CPU number."
    }
  }];
}

// Virtual memory of a compute resource.
message VirtualMemory {
  option (kubenfv.kubevim.options.v1.ifa_message) = {ref: "IFA006 8.4.3.5 VirtualMemory"};

  // Amount of memory, in Kubernetes quantity format.
  string virtual_mem_size = 1 [(kubenfv.kubevim.options.v1.ifa_field) = {
    ref: "IFA006 8.4.3.5 VirtualMemory.virtualMemSize"
    departure: {
      kind: KIND_DEVIATION
      translates: true
      rationale: "Kubernetes quantity string instead of a number in MB."
    }
  }];
  string virtual_mem_oversubscription_policy = 2 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.5 VirtualMemory.virtualMemOversubscriptionPolicy"}];
  bool numa_enabled = 3 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.5 VirtualMemory.numaEnabled"}];
  // Hugepage size backing the memory; empty for regular pages.
  string hugepage_size = 4 [(kubenfv.kubevim.options.v1.ifa_field) = {
    departure: {
      kind: KIND_EXTENSION
      translates: true
      rationale: "Reports the hugepages requested by the flavour."
    }
  }];
}

// A network interface of a compute resource.
message VirtualNetworkInterface {
  option (kubenfv.kubevim.options.v1.ifa_message) = {ref: "IFA006 8.4.3.6 VirtualNetworkInterface"};

  // Identifier of the interface: its name, unique within the compute resource (e.g. "net1").
  string resource_id = 1 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.6 VirtualNetworkInterface.resourceId"}];
  // Compute resource the interface belongs to.
  string owner_id = 2 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.6 VirtualNetworkInterface.ownerId"}];
  string network_id = 3 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.6 VirtualNetworkInterface.networkId"}];
  // Subnet the interface takes its addresses from.
  string subnet_id = 4 [(kubenfv.kubevim.options.v1.ifa_field) = {
    departure: {
      kind: KIND_EXTENSION
      translates: true
      rationale: "A network can have several subnets; the interface reports which one it uses."
    }
  }];
  string network_port_id = 5 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.6 VirtualNetworkInterface.networkPortId"}];
  // Addresses of the interface; may be empty until DHCP or the guest configures them.
  repeated string ip_address = 6 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.6 VirtualNetworkInterface.ipAddress"}];
  TypeVirtualNic type_virtual_nic = 7 [(kubenfv.kubevim.options.v1.ifa_field) = {
    ref: "IFA006 8.4.3.6 VirtualNetworkInterface.typeVirtualNic"
    departure: {
      kind: KIND_DEVIATION
      translates: true
      rationale: "IFA leaves the type unspecified; a closed enumeration."
    }
  }];
  repeated string type_configuration = 8 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.6 VirtualNetworkInterface.typeConfiguration"}];
  string mac_address = 9 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.6 VirtualNetworkInterface.macAddress"}];
  // Bandwidth in Mbps; 0 when not limited.
  uint32 bandwidth = 10 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.6 VirtualNetworkInterface.bandwidth"}];
  repeated string acceleration_capability = 11 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.6 VirtualNetworkInterface.accelerationCapability"}];
  // ENABLED once the interface is attached and ready.
  kubenfv.kubevim.common.v1.OperationalState operational_state = 12 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.6 VirtualNetworkInterface.operationalState"}];
  map<string, string> metadata = 13 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.6 VirtualNetworkInterface.metadata"}];
  // The management interface every compute resource gets on the pod network.
  bool is_management = 14 [(kubenfv.kubevim.options.v1.ifa_field) = {
    departure: {
      kind: KIND_EXTENSION
      translates: true
      rationale: "Marks the management interface; replaces the v0 network.vm.kubevirt.io/management metadata key."
    }
  }];
  // PCI address of the device on the host, for SR-IOV and passthrough interfaces.
  string host_pci_address = 15 [(kubenfv.kubevim.options.v1.ifa_field) = {
    departure: {
      kind: KIND_EXTENSION
      translates: true
      rationale: "Lets the consumer correlate an SR-IOV VF with the host NIC; replaces the v0 host-pci-address metadata key."
    }
  }];
  // Auxiliary information from the VIM; keys are listed in the metadata key registry.
  map<string, string> vim_metadata = 16 [(kubenfv.kubevim.options.v1.ifa_field) = {
    departure: {
      kind: KIND_EXTENSION
      translates: true
      rationale: "VIM-side diagnostics kept apart from the consumer-owned metadata."
    }
  }];
}

// How a network interface is realised.
// Values may be added as KubeVirt support grows; clients should accept unknown values.
enum TypeVirtualNic {
  TYPE_VIRTUAL_NIC_UNSPECIFIED = 0;
  // Virtual NIC bridged to the network.
  TYPE_VIRTUAL_NIC_BRIDGE = 1;
  // SR-IOV virtual function.
  TYPE_VIRTUAL_NIC_SRIOV = 2;
  // Whole PCI device passed through to the guest.
  TYPE_VIRTUAL_NIC_PCI_PASSTHROUGH = 3;
  // NAT to the pod network; reported for the management interface, rejected in requests.
  TYPE_VIRTUAL_NIC_MASQUERADE = 4;
}

// A network interface requested for a new compute resource.
message NetworkInterfaceData {
  option (kubenfv.kubevim.options.v1.ifa_message) = {
    ref: "IFA006 8.4.3.7 VirtualInterfaceData, 8.4.2.6 VirtualNetworkInterfaceData"
    departure: {
      kind: KIND_DEVIATION
      translates: true
      rationale: "One list on allocation: IFA's per-instance VirtualInterfaceData merged with the flavour-level VirtualNetworkInterfaceData."
    }
  };

  // Network to attach to; one of network_id, subnet_id and network_port_id is required.
  string network_id = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.7 VirtualInterfaceData.networkId"}
  ];
  // Subnet to take addresses from; identifies the network on its own when network_id is unset.
  string subnet_id = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      departure: {
        kind: KIND_EXTENSION
        translates: true
        rationale: "Selects the subnet on networks with several, e.g. VPC networks."
      }
    }
  ];
  // Existing port to attach to.
  string network_port_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.2.6 VirtualNetworkInterfaceData.networkPortId"}
  ];
  // How the interface is realised; the VIM chooses from the network when unset.
  TypeVirtualNic type_virtual_nic = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [4]
    },
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 8.4.2.6 VirtualNetworkInterfaceData.typeVirtualNic"
      departure: {
        kind: KIND_DEVIATION
        translates: true
        rationale: "IFA leaves the type unspecified; a closed enumeration, optional because the network implies it."
      }
    }
  ];
  // Extra configuration for the interface type.
  repeated string type_configuration = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 8.4.2.6 VirtualNetworkInterfaceData.typeConfiguration"
      departure: {
        kind: KIND_RESTRICTION
        translates: false
        rationale: "Not supported yet; a value is rejected."
      }
    }
  ];
  // Bandwidth limit in Mbps; 0 means no limit.
  uint32 bandwidth = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.2.6 VirtualNetworkInterfaceData.bandwidth"}
  ];
  // Acceleration capabilities, as Kubernetes device resource names.
  repeated string acceleration_capability = 7 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 8.4.2.6 VirtualNetworkInterfaceData.accelerationCapability"
      departure: {
        kind: KIND_RESTRICTION
        translates: false
        rationale: "Not supported yet; a value is rejected."
      }
    }
  ];
  // How the interface gets its addresses.
  IpAssignment ip_assignment = 8 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).enum.defined_only = true,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      departure: {
        kind: KIND_EXTENSION
        translates: true
        rationale: "Replaces the v0 network.subnet.assignment metadata key; IFA implies the mode from whether addresses are given."
      }
    }
  ];
  // Addresses for the static assignment.
  repeated string ip_address = 9 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).repeated.items.string.ip = true,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.7 VirtualInterfaceData.ipAddress"}
  ];
  // MAC address; the VIM assigns one when unset.
  string mac_address = 10 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.pattern = "^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.3.7 VirtualInterfaceData.macAddress"}
  ];
  // Metadata owned by the consumer and never interpreted by the VIM.
  map<string, string> metadata = 11 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.2.6 VirtualNetworkInterfaceData.metadata"}
  ];

  option (buf.validate.message).cel = {
    id: "interface.attachment"
    message: "networkId, subnetId or networkPortId is required"
    expression: "this.network_id != '' || this.subnet_id != '' || this.network_port_id != ''"
  };
  option (buf.validate.message).cel = {
    id: "interface.ip_assignment"
    message: "ipAddress is required for STATIC assignment and not allowed otherwise"
    expression: "this.ip_assignment == 2 ? this.ip_address.size() > 0 : this.ip_address.size() == 0"
  };
}

// How a network interface gets its addresses.
enum IpAssignment {
  IP_ASSIGNMENT_UNSPECIFIED = 0;
  // The VIM allocates addresses from the subnet; the default.
  IP_ASSIGNMENT_AUTOMATIC = 1;
  // The addresses in ip_address are used.
  IP_ASSIGNMENT_STATIC = 2;
  // No addresses: a layer 2 interface, or the guest configures its own.
  IP_ASSIGNMENT_NONE = 3;
}

// User data passed to the compute resource at boot time.
message UserData {
  option (kubenfv.kubevim.options.v1.ifa_message) = {ref: "IFA006 8.4.10 UserData"};

  // User data, e.g. a cloud-init document; transparent to the VIM.
  string content = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = INPUT_ONLY,
    (buf.validate.field).string.min_len = 1,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.10 UserData.content"}
  ];
  // How the content reaches the guest; NoCloud when unset.
  UserDataTransportationMethod method = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).enum.defined_only = true,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.10 UserData.method"}
  ];
  // Certificates for the VNF (delegation mode).
  repeated CertificateData certificate_data = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 8.4.10 UserData.certificateData"
      departure: {
        kind: KIND_RESTRICTION
        translates: false
        rationale: "Delegation-mode certificates are not supported yet; a value is rejected."
      }
    }
  ];
}

// How user data reaches the guest.
// Values may be added as KubeVirt support grows; clients should accept unknown values.
enum UserDataTransportationMethod {
  USER_DATA_TRANSPORTATION_METHOD_UNSPECIFIED = 0;
  // Config drive with plain-text cloud-init content.
  USER_DATA_TRANSPORTATION_METHOD_CONFIG_DRIVE = 1;
  // Config drive with MIME multipart content.
  USER_DATA_TRANSPORTATION_METHOD_CONFIG_DRIVE_MIME_MULTIPART = 2;
  // Local disk in cloud-init NoCloud format.
  USER_DATA_TRANSPORTATION_METHOD_NO_CLOUD = 3;
}

// Certificate material for a VNF in delegation mode (IFA006 8.4.11).
message CertificateData {
  // Private key paired with the signed public key; with certificate_file, or keystore_file alone.
  string private_key = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = INPUT_ONLY
  ];
  // Signed certificate with the public key and chain.
  string certificate_file = 2 [(google.api.field_behavior) = OPTIONAL];
  // Keystore with key, certificate and chain, e.g. PKCS#12.
  string keystore_file = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = INPUT_ONLY
  ];
  // Subject to be signed.
  string cert_subject_data = 4 [(google.api.field_behavior) = OPTIONAL];
  // Certificate profile to sign with.
  string certificate_profile_name = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 8.4.11 CertificateData.certifiateProfileName"
      departure: {
        kind: KIND_DEVIATION
        translates: true
        rationale: "Spelling corrected; IFA has certifiateProfileName."
      }
    }
  ];
}

message CreateComputeRequest {
  // Compute resource to create: name, flavour, image and metadata.
  Compute compute = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
  // Client-chosen UUID that makes the request idempotent (AIP-155).
  string request_id = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Network interfaces, in guest order.
  repeated NetworkInterfaceData interface_data = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.3.1.2.2 AllocateComputeRequest.interfaceData"}
  ];
  // User data passed at boot time.
  UserData user_data = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.3.1.2.2 AllocateComputeRequest.userData"}
  ];
  // Start the compute resource once created; unset means true.
  optional bool start = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      departure: {
        kind: KIND_EXTENSION
        translates: true
        rationale: "Creates a compute resource without starting it, e.g. to attach volumes first."
      }
    }
  ];
  // Resource reservation for this allocation.
  string reservation_id = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 7.3.1.2.2 AllocateComputeRequest.reservationId"
      departure: {
        kind: KIND_RESTRICTION
        translates: false
        rationale: "Kube-VIM has no reservations yet; a value is rejected."
      }
    }
  ];
  // Affinity or anti-affinity with other compute resources; all must be met.
  repeated kubenfv.kubevim.common.v1.AffinityOrAntiAffinityConstraint affinity_or_anti_affinity_constraints = 7 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.3.1.2.2 AllocateComputeRequest.affinityOrAntiAffinityConstraints"}
  ];
  // Location constraints, e.g. a resource zone.
  string location_constraints = 8 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 7.3.1.2.2 AllocateComputeRequest.locationConstraints"
      departure: {
        kind: KIND_RESTRICTION
        translates: false
        rationale: "Kube-VIM exposes one VIM per edge instead of zones; a value is rejected."
      }
    }
  ];
  // Infrastructure resource group of the compute resource.
  string resource_group_id = 9 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 7.3.1.2.2 AllocateComputeRequest.resourceGroupId"
      departure: {
        kind: KIND_RESTRICTION
        translates: false
        rationale: "No resource groups until Kube-VIM has tenancy; a value is rejected."
      }
    }
  ];
}

message GetComputeRequest {
  // Identifier of the compute resource.
  string compute_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.uuid = true
  ];
}

message ListComputesRequest {
  // Attribute-based filter expression (SOL 013 5.2).
  string filter = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.3.1.3.2 QueryComputeRequest.queryComputeFilter"}
  ];
  // Marker of the page to return, from a previous response (SOL 013 5.4).
  string nextpage_opaque_marker = 2 [
    json_name = "nextpage_opaque_marker",
    (google.api.field_behavior) = OPTIONAL
  ];
}

message ListComputesResponse {
  // Compute resources matching the filter.
  repeated Compute computes = 1 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.3.1.3.3 QueryComputeResponse.queryResult"}];
  // Marker of the next page; empty on the last page (SOL 013 5.4).
  string nextpage_opaque_marker = 2 [json_name = "nextpage_opaque_marker"];
}

message UpdateComputeRequest {
  // Identifier of the compute resource.
  string compute_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.uuid = true
  ];
