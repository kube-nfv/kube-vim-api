  ComputeUpdate update = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
}

// Changes to a compute resource.
message ComputeUpdate {
  option (kubenfv.kubevim.options.v1.ifa_message) = {
    ref: "IFA006 7.3.1.4.2 UpdateComputeRequest"
    departure: {
      kind: KIND_DEVIATION
      translates: true
      rationale: "Interfaces to add and to remove by identifier; IFA's in-place interface updates and power state are restrictions."
    }
  };

  // Network interfaces to add (hotplug).
  repeated NetworkInterfaceData network_interfaces_to_add = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.3.1.4.2 UpdateComputeRequest.networkInterfaceNew"}
  ];
  // Network interfaces to remove, by resource_id (the interface name).
  repeated string network_interface_ids_to_remove = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      departure: {
        kind: KIND_EXTENSION
        translates: true
        rationale: "Removes interfaces; IFA only updates them in place."
      }
    }
  ];
  // Interfaces to change in place, e.g. re-attach to another port.
  repeated VirtualNetworkInterface network_interfaces_to_update = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 7.3.1.4.2 UpdateComputeRequest.networkInterfaceUpdate"
      departure: {
        kind: KIND_RESTRICTION
        translates: false
        rationale: "In-place interface changes are not supported; remove and add instead. A value is rejected."
      }
    }
  ];
  // Target power state.
  string power_state = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 7.3.1.4.2 UpdateComputeRequest.powerStateUpdate"
      departure: {
        kind: KIND_RESTRICTION
        translates: false
        rationale: "Use OperateCompute to start, stop or pause; a value is rejected."
      }
    }
  ];
  // Metadata entries to add or replace.
  map<string, string> metadata = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.3.1.4.2 UpdateComputeRequest.metaData"}
  ];
  // Metadata keys to remove.
  repeated string metadata_keys_to_remove = 6 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteComputeRequest {
  // Identifier of the compute resource.
  string compute_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.uuid = true,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.3.1.5.2 TerminateComputeRequest.computeId"}
  ];
}

message OperateComputeRequest {
  // Identifier of the compute resource.
  string compute_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.uuid = true,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.3.1.6.2 OperateComputeRequest.computeId"}
  ];
  // Operation to run.
  ComputeOperation compute_operation = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    },
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 7.3.1.6.2 OperateComputeRequest.computeOperation"
      departure: {
        kind: KIND_DEVIATION
        translates: true
        rationale: "A closed enumeration instead of a free string, plus RESUME."
      }
    }
  ];
  // Operation parameters, e.g. "snapshotId" for REVERT_TO_SNAPSHOT and DELETE_SNAPSHOT.
  map<string, string> compute_operation_input_data = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.3.1.6.2 OperateComputeRequest.computeOperationInputData"}
  ];
}

message OperateComputeResponse {
  // Compute resource after the operation.
  Compute compute_data = 1 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.3.1.6.3 OperateComputeResponse.computeData"}];
  // Operation results, e.g. "snapshotId" for CREATE_SNAPSHOT.
  map<string, string> compute_operation_output_data = 2 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.3.1.6.3 OperateComputeResponse.computeOperationOutputData"}];
}

// Operation on a compute resource (IFA006 7.3.1.6).
// Values may be added as KubeVirt support grows; clients should accept unknown values.
enum ComputeOperation {
  COMPUTE_OPERATION_UNSPECIFIED = 0;
  COMPUTE_OPERATION_START = 1;
  COMPUTE_OPERATION_STOP = 2;
  // Pause, keeping memory.
  COMPUTE_OPERATION_PAUSE = 3;
  // Resume after PAUSE or SUSPEND; Kube-VIM extension, IFA has no inverse.
  COMPUTE_OPERATION_RESUME = 4;
  // Suspend, saving memory to disk.
  COMPUTE_OPERATION_SUSPEND = 5;
  COMPUTE_OPERATION_REBOOT = 6;
  // Freeze guest file systems (guest agent).
  COMPUTE_OPERATION_QUIESCE = 7;
  // Thaw guest file systems.
  COMPUTE_OPERATION_UNQUIESCE = 8;
  COMPUTE_OPERATION_CREATE_SNAPSHOT = 9;
  COMPUTE_OPERATION_REVERT_TO_SNAPSHOT = 10;
  COMPUTE_OPERATION_DELETE_SNAPSHOT = 11;
}

message ScaleComputeRequest {
  // Identifier of the compute resource.
  string compute_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.uuid = true,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.3.1.7.2 ScaleComputeRequest.computeId"}
  ];
