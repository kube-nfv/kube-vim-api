  ];
}

message MigrateComputeRequest {
  // Identifier of the compute resource.
  string compute_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.uuid = true,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.3.1.8.2 MigrateComputeRequest.computeId"}
  ];
  // Live or offline migration.
  MigrationType migration_type = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    },
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.3.1.8.2 MigrateComputeRequest.migrationType"}
  ];
  // Where to migrate to, e.g. a resource zone.
  string migration_constraint = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 7.3.1.8.2 MigrateComputeRequest.migrationConstraint"
