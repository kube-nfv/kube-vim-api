      }
    }
  ];
  // Affinity or anti-affinity the new placement must meet.
  repeated kubenfv.kubevim.common.v1.AffinityOrAntiAffinityConstraint affinity_or_anti_affinity_constraints = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.3.1.8.2 MigrateComputeRequest.affinityOrAntiAffinityConstraints"}
  ];
}

// Type of migration (IFA006 7.3.1.8).
enum MigrationType {
  MIGRATION_TYPE_UNSPECIFIED = 0;
  // The compute resource keeps running (KubeVirt live migration).
