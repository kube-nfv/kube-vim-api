// A group of compute resources placed together or apart (decision 0005).
message PlacementGroup {
  option (kubenfv.kubevim.options.v1.ifa_message) = {
    ref: "IFA006 7.3.1.9 Create Compute Resource Affinity Or AntiAffinity Constraints Group"
    departure: {
      kind: KIND_DEVIATION
      translates: true
      rationale: "A resource with a placement policy and members; IFA groups have only a type and scope, and cannot be read or deleted."
    }
  };

  // Identifier of the group: a UUID assigned by the VIM.
  string placement_group_id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 7.3.1.9.3 groupId"
      departure: {
        kind: KIND_DEVIATION
        translates: true
        rationale: "Renamed to the resource name; identifiers are <resource>_id."
      }
    }
  ];
  // Name of the group, given by the consumer; not unique.
  string placement_group_name = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 7.3.1.9.2 groupName"
      departure: {
        kind: KIND_DEVIATION
        translates: true
        rationale: "Renamed to the resource name; names are <resource>_name."
      }
    }
  ];
  // Whether members are placed together or apart.
  PlacementType type = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    },
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.3.1.9.2 type"}
  ];
  // Topology domain the policy applies to; PLACEMENT_SCOPE_NODE when unset.
  PlacementScope scope = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).enum.defined_only = true,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      ref: "IFA006 7.3.1.9.2 scope"
      departure: {
        kind: KIND_DEVIATION
        translates: true
        rationale: "Node and zone; IFA's NFVI-PoP is the whole VIM, and the port and network scopes have no Kubernetes meaning."
      }
    }
  ];
  // Whether the policy must hold or is applied when possible; PLACEMENT_ENFORCEMENT_REQUIRED when unset.
  PlacementEnforcement enforcement = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).enum.defined_only = true,
    (kubenfv.kubevim.options.v1.ifa_field) = {
      departure: {
        kind: KIND_EXTENSION
        translates: true
        rationale: "Soft rules spread VNF components where possible; IFA constraints are hard only."
      }
    }
  ];
  // Compute resources in the group.
  repeated string compute_ids = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Metadata set by the consumer and by the VIM; for keys under "kubevim.kubenfv.io/" that the VIM maintains, its value wins.
  map<string, string> metadata = 7 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).map.(kubenfv.kubevim.common.v1.metadata) = true
  ];
}

// Whether members of a placement group are placed together or apart.
enum PlacementType {
  PLACEMENT_TYPE_UNSPECIFIED = 0;
  // In the same topology domain.
  PLACEMENT_TYPE_AFFINITY = 1;
  // In different topology domains.
  PLACEMENT_TYPE_ANTI_AFFINITY = 2;
}

// Topology domain a placement policy applies to.
// Values may be added; clients should accept unknown values.
enum PlacementScope {
  PLACEMENT_SCOPE_UNSPECIFIED = 0;
  // A Kubernetes node.
  PLACEMENT_SCOPE_NODE = 1;
  // A Kubernetes zone (topology.kubernetes.io/zone).
  PLACEMENT_SCOPE_ZONE = 2;
}

// Whether a placement policy must hold.
enum PlacementEnforcement {
  PLACEMENT_ENFORCEMENT_UNSPECIFIED = 0;
  // A compute resource that cannot meet the policy is not scheduled.
  PLACEMENT_ENFORCEMENT_REQUIRED = 1;
  // The policy is met when possible.
  PLACEMENT_ENFORCEMENT_PREFERRED = 2;
}

message CreatePlacementGroupRequest {
  // Group to create.
  PlacementGroup placement_group = 1 [
