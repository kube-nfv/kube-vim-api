// proto2: predefined protovalidate rules extend buf.validate.StringRules, which proto3 cannot.
syntax = "proto2";

package kubenfv.kubevim.common.v1;

import "buf/validate/validate.proto";

extend buf.validate.StringRules {
  // The string is a Kubernetes resource quantity, e.g. "10Gi" or "500M".
  // Extension number 1391 as in kubenfv.kubevim.options.v1.
  optional bool quantity = 1391 [(buf.validate.predefined).cel = {
    id: "string.quantity"
    expression: "!rule || this.matches(r'^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$') ? '' : 'must be a Kubernetes quantity, e.g. \"10Gi\"'"
  }];
}
