syntax = "proto3";

package kubenfv.kubevim.common.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "kubenfv/kubevim/options/v1/options.proto";

// Affinity or anti-affinity of a resource being allocated with other resources.
message AffinityOrAntiAffinityConstraint {
  option (kubenfv.kubevim.options.v1.ifa_message) = {ref: "IFA006 8.4.8.2 AffinityOrAntiAffinityConstraint"};

  // Affinity or anti-affinity.
  AffinityType type = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    },
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.8.2 AffinityOrAntiAffinityConstraint.type"}
  ];
  // Scope of the constraint; NFVI node when unset.
  AffinityScope scope = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).enum.defined_only = true,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.8.2 AffinityOrAntiAffinityConstraint.scope"}
  ];
  // Resources to be affine or anti-affine with: a consumer-managed list or a producer-managed group.
  oneof resources {
    option (buf.validate.oneof).required = true;

    // Consumer-managed list of resource identifiers.
    AffinityOrAntiAffinityResourceList affinity_or_anti_affinity_resource_list = 3 [(kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.8.2 AffinityOrAntiAffinityConstraint.affinityOrAntiAffinityResourceList"}];
    // Identifier of an affinity group created with CreateAffinityGroup.
    string affinity_or_anti_affinity_resource_group_id = 4 [
      (buf.validate.field).string.uuid = true,
      (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.8.2 AffinityOrAntiAffinityConstraint.affinityOrAntiAffinityResourceGroupId"}
    ];
  }
}

// Consumer-managed list of resources (IFA006 8.4.8.3).
message AffinityOrAntiAffinityResourceList {
  // Identifiers of virtualised resources.
  repeated string resource_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated = {
      min_items: 1
      items: {
        string: {uuid: true}
      }
    },
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 8.4.8.3 AffinityOrAntiAffinityResourceList.resourceId"}
  ];
}

// Producer-managed group of resources placed with affinity or anti-affinity.
message AffinityGroup {
  option (kubenfv.kubevim.options.v1.ifa_message) = {
    ref: "IFA006 7.3.1.9, 7.4.1.6, 7.5.1.9 Create Resource Affinity Or AntiAffinity Constraints Group"
    departure: {
      kind: KIND_DEVIATION
      translates: true
      rationale: "A resource with Get, List and Delete; IFA only creates groups and never removes them."
    }
  };

  // Identifier of the group: a UUID, the Kubernetes UID of the object behind it.
  string group_id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.4.1.6.3 groupId"}
  ];
  // Name of the group, given by the consumer.
  string group_name = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.4.1.6.2 groupName"}
  ];
  // Affinity or anti-affinity.
  AffinityType type = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    },
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.4.1.6.2 type"}
  ];
  // Scope of the group; NFVI node when unset.
  AffinityScope scope = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).enum.defined_only = true,
    (kubenfv.kubevim.options.v1.ifa_field) = {ref: "IFA006 7.4.1.6.2 scope"}
  ];
}

// Affinity or anti-affinity.
enum AffinityType {
  AFFINITY_TYPE_UNSPECIFIED = 0;
  // Placed in proximity, e.g. on the same NFVI node.
  AFFINITY_TYPE_AFFINITY = 1;
  // Not placed in proximity, e.g. on different NFVI nodes.
  AFFINITY_TYPE_ANTI_AFFINITY = 2;
}

// Scope of an affinity or anti-affinity constraint (IFA006 8.4.8.2). Which
// values apply depends on the resource: compute uses NFVI_POP and NFVI_NODE;
// ports add VIRTUAL_SWITCH_OR_ROUTER, PHYSICAL_NIC and PHYSICAL_NETWORK;
// networks use PHYSICAL_NIC, PHYSICAL_NETWORK and NFVI_NODE.
enum AffinityScope {
  AFFINITY_SCOPE_UNSPECIFIED = 0;
  AFFINITY_SCOPE_NFVI_POP = 1;
  AFFINITY_SCOPE_NFVI_NODE = 2;
  AFFINITY_SCOPE_VIRTUAL_SWITCH_OR_ROUTER = 3;
  AFFINITY_SCOPE_PHYSICAL_NIC = 4;
  AFFINITY_SCOPE_PHYSICAL_NETWORK = 5;
}
