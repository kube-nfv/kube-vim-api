name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GOTOOLCHAIN: auto

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    # PyPI trusted publisher for kubevim-client is bound to this environment.
    environment: pypi
    permissions:
      contents: write   # create GitHub Release
      id-token: write   # PyPI trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Validate tag format
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'; then
            echo "Tag '$GITHUB_REF_NAME' does not match vX.Y.Z[-alpha|beta|rc.N]"
            exit 1
          fi

      - name: Translate tag to PEP 440
        id: version
        run: |
          echo "semver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "pep440=$(echo "${GITHUB_REF_NAME#v}" | sed -e 's/-alpha\./a/' -e 's/-beta\./b/' -e 's/-rc\./rc/')" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$GITHUB_REF_NAME" =~ -(alpha|beta|rc)\. ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Regenerates the committed files with the release version stamped in.
      - name: Generate
        run: make generate VERSION=${{ steps.version.outputs.semver }} PYTHON_PACKAGE_VERSION=${{ steps.version.outputs.pep440 }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test Python client
        run: make test-python PYTHON=python

      - name: Build Python package
        run: |
          pip install build
          python -m build generated/python

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: generated/python/dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp generated/openapi/kubevim.openapi.json generated/openapi/*/v1/*.openapi.json generated/python/dist/
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            generated/python/dist/*
